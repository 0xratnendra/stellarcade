name: Contract Size

on:
  pull_request:
    paths:
      - "contracts/**"
      - "scripts/contract-size.mjs"

jobs:
  contract-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-size-${{ hashFiles('contracts/**/Cargo.toml') }}

      - name: Report contract wasm sizes
        run: node scripts/contract-size.mjs
