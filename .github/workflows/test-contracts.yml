name: Test Smart Contracts

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: wasm32v1-none,wasm32-unknown-unknown

      - name: Ensure wasm target
        run: rustup target add wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/**/Cargo.toml') }}

      # Whole workspace, not a curated subset — a crate left off a hand
      # maintained list here is a crate that silently never gets built or
      # tested. Only stellarcade-contract-doc-generator and
      # deployment-scripts (its actual package name has no stellarcade-
      # prefix, unlike every other crate here) are excluded from the wasm
      # build: they're native tooling, not deployable contracts (no [lib]
      # cdylib target) and depend on std (serde_json/tempfile), which
      # doesn't exist for wasm32v1-none. A wrong exclude name here silently
      # fails to match and pulls a std-only crate into the no-std build,
      # corrupting feature resolution for the whole workspace. They're
      # still covered by the workspace-wide test run below.
      - name: Build every contract (wasm)
        run: |
          cd contracts
          cargo build --workspace --target wasm32v1-none --release --locked \
            --exclude stellarcade-contract-doc-generator \
            --exclude deployment-scripts

      - name: Run every crate's tests
        run: cd contracts && cargo test --workspace --locked

      - name: Verify Contract Documentation
        run: |
          cargo run --package stellarcade-contract-doc-generator --manifest-path contracts/contract-doc-generator/Cargo.toml
          if [ -n "$(git status --porcelain docs/contracts)" ]; then
            echo "Error: Contract documentation is out of sync. Please run 'cargo run --package stellarcade-contract-doc-generator' and commit the changes."
            git diff docs/contracts
            exit 1
          fi
