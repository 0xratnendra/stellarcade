name: Lint Codebase

on: [pull_request]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run ESLint
        run: cd backend && npm install && npm run lint

  lint-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy
      # Whole workspace, not a curated subset — a crate left off a hand
      # maintained list here is a crate that silently never gets linted.
      - name: Run Clippy (entire contracts workspace)
        run: cd contracts && cargo clippy --workspace --locked -- -D warnings

  lint-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Web Lint
        run: pnpm --filter @stellarcade/web run lint
