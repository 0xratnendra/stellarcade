{
  'openapi': '3.0.3',
  'info':
    {
      'title': 'Stellarcade Backend API',
      'version': '1.0.0',
      'description': 'Generated OpenAPI specification for the current Express route surface.',
    },
  'servers': [{ 'url': 'http://localhost:3000', 'description': 'Local development server' }],
  'tags':
    [
      { 'name': 'Health' },
      { 'name': 'Auth' },
      { 'name': 'Games' },
      { 'name': 'Users' },
      { 'name': 'Wallet' },
      { 'name': 'Leaderboard' },
      { 'name': 'Quests' },
      { 'name': 'Tournaments' },
    ],
  'paths':
    {
      '/api/health':
        {
          'get':
            {
              'operationId': 'getHealthStatus',
              'summary': 'Check API health',
              'tags': ['Health'],
              'responses':
                {
                  '200':
                    {
                      'description': 'API health payload returned successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/HealthResponse' } },
                        },
                    },
                },
            },
        },
      '/api/auth/challenge':
        {
          'post':
            {
              'operationId': 'createLoginChallenge',
              'summary': 'Issue a one-time login challenge for a wallet address to sign',
              'tags': ['Auth'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Challenge issued successfully',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'required': ['challenge'],
                                  'properties': { 'challenge': { 'type': 'string' } },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing address',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['address'],
                              'properties': { 'address': { 'type': 'string' } },
                            },
                        },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/auth/login':
        {
          'post':
            {
              'operationId': 'login',
              'summary': 'Verify a signed challenge and issue a session JWT',
              'tags': ['Auth'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Login successful',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'required': ['token', 'profile'],
                                  'properties':
                                    {
                                      'token': { 'type': 'string' },
                                      'profile':
                                        { '$ref': '#/components/schemas/UserProfileResponse' },
                                    },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing fields, no pending challenge, or the challenge expired',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '401':
                    {
                      'description': 'Signature does not verify against the given address',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '503':
                    {
                      'description': 'Login is not configured on this deployment (JWT_SECRET unset)',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        {
                          'schema':
                            {
                              'type': 'object',
                              'required': ['address', 'signature'],
                              'properties':
                                {
                                  'address': { 'type': 'string' },
                                  'signature':
                                    {
                                      'type': 'string',
                                      'description': 'Base64-encoded Ed25519 signature.',
                                    },
                                },
                            },
                        },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/games':
        {
          'get':
            {
              'operationId': 'listGames',
              'summary': 'List available games',
              'tags': ['Games'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Available games returned successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/GamesCatalogResponse' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
            },
        },
      '/api/games/recent':
        {
          'get':
            {
              'operationId': 'listRecentGames',
              'summary': 'List recent games with pagination and filters',
              'tags': ['Games'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Recent games returned successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/RecentGamesResponse' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'name': 'page',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 1, 'default': 1 },
                    'description': 'Page number to retrieve',
                  },
                  {
                    'name': 'limit',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 1, 'default': 10 },
                    'description': 'Number of games to return per page',
                  },
                  {
                    'name': 'player',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Filter recent games by player address (Stellar G... address).',
                  },
                  {
                    'name': 'gameType',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Filter recent games by game type',
                  },
                  {
                    'name': 'status',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Filter recent games by result status',
                  },
                  {
                    'name': 'sortBy',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Field used for sorting',
                  },
                  {
                    'name': 'sortDir',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string', 'enum': ['asc', 'desc'] },
                    'description': 'Sort direction',
                  },
                ],
            },
        },
      '/api/games/:contractId/:id':
        {
          'get':
            {
              'operationId': 'getIndexedGame',
              'summary': 'Fetch one indexed on-chain game by contract id and on-chain game id',
              'tags': ['Games'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Indexed game returned successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/IndexedGameResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Invalid contract id or game id',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '404':
                    {
                      'description': 'No game indexed for this contract id and game id',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'description': 'Reads the row the event indexer wrote for a single round. 404 GAME_NOT_FOUND means the round is not indexed yet (or the ids are wrong), which is distinct from the backend being unavailable.',
              'parameters':
                [
                  {
                    'name': 'contractId',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string' },
                    'description': 'Coin-flip contract id (Stellar contract address, C...).',
                  },
                  {
                    'name': 'id',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string' },
                    'description': 'On-chain game id as a decimal u64 string.',
                  },
                ],
            },
        },
      '/api/users/profile':
        {
          'get':
            {
              'operationId': 'getUserProfile',
              'summary': 'Fetch a profile by wallet address',
              'tags': ['Users'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Profile fetched successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/UserProfileResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing or invalid "address" query parameter',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '404':
                    {
                      'description': 'No profile exists for that wallet address yet — the wallet needs onboarding',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'name': 'address',
                    'in': 'query',
                    'required': true,
                    'schema': { 'type': 'string' },
                    'description': 'Stellar wallet address (G...) to look up.',
                  },
                ],
            },
        },
      '/api/users/audit-logs':
        {
          'get':
            {
              'operationId': 'listUserAuditLogs',
              'summary': 'List audit log entries',
              'tags': ['Users'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Audit log entries fetched successfully',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'required': ['items'],
                                  'properties':
                                    {
                                      'items':
                                        {
                                          'type': 'array',
                                          'items':
                                            { 'type': 'object', 'additionalProperties': true },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Invalid query parameter',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '401':
                    {
                      'description': 'Authentication failed',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/AuthErrorResponse' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'name': 'actor',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Optional actor wallet address filter.',
                  },
                  {
                    'name': 'action',
                    'in': 'query',
                    'required': false,
                    'schema':
                      {
                        'type': 'string',
                        'enum': ['wallet.deposit', 'wallet.withdraw', 'game.play'],
                      },
                    'description': 'Optional action filter.',
                  },
                  {
                    'name': 'limit',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 1, 'default': 50 },
                    'description': 'Maximum number of records returned.',
                  },
                ],
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/users/create':
        {
          'post':
            {
              'operationId': 'createUserProfile',
              'summary': 'Create a new profile (idempotent — returns the existing one if the wallet already has a profile)',
              'tags': ['Users'],
              'responses':
                {
                  '201':
                    {
                      'description': 'Profile created (or already existed) successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/UserProfileResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing walletAddress',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/CreateProfileRequest' } },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/users/update':
        {
          'post':
            {
              'operationId': 'updateUserProfile',
              'summary': 'Update an existing profile — username and/or Telegram link fields',
              'tags': ['Users'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Profile updated successfully',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/UserProfileResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing walletAddress',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '404':
                    {
                      'description': 'No existing profile for that wallet address — use /create first',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/UpdateProfileRequest' } },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/wallet/:address/balance':
        {
          'get':
            {
              'operationId': 'getWalletBalance',
              'summary': "Fetch a wallet's real on-chain balances from Horizon",
              'tags': ['Wallet'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Balances returned successfully. An address that is well-formed but has never been funded on-chain returns a zero XLM balance rather than an error.',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'object',
                                  'required': ['address', 'balances'],
                                  'properties':
                                    {
                                      'address': { 'type': 'string' },
                                      'balances':
                                        {
                                          'type': 'object',
                                          'additionalProperties': { 'type': 'string' },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'The given address is not a valid Stellar public key',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'name': 'address',
                    'in': 'path',
                    'required': true,
                    'schema': { 'type': 'string' },
                    'description': 'Stellar wallet address (G...).',
                  },
                ],
            },
        },
      '/api/wallet/deposit':
        {
          'post':
            {
              'operationId': 'createDeposit',
              'summary': 'Create a deposit request for the authenticated user (disabled — no verified on-chain flow yet)',
              'tags': ['Wallet'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Deposit request accepted. Not reachable while the deposit flow is disabled.',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/DepositResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Request payload validation failed',
                      'content':
                        {
                          'application/json':
                            {
                              'schema': { '$ref': '#/components/schemas/ValidationErrorResponse' },
                            },
                        },
                    },
                  '401':
                    {
                      'description': 'Authentication failed',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/AuthErrorResponse' } },
                        },
                    },
                  '409':
                    {
                      'description': 'Idempotency key conflict detected',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/IdempotencyConflictResponse' },
                            },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '501':
                    {
                      'description': 'The deposit flow is disabled: no verified on-chain settlement flow is wired up yet, so the request is refused before anything is read from or written to the database. The error code is WALLET_FLOW_DISABLED.',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters': [{ '$ref': '#/components/parameters/IdempotencyKeyHeader' }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/DepositRequest' } },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/wallet/withdraw':
        {
          'post':
            {
              'operationId': 'createWithdrawal',
              'summary': 'Create a withdrawal request for the authenticated user (disabled — no verified on-chain flow yet)',
              'tags': ['Wallet'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Withdrawal request accepted. Not reachable while the withdrawal flow is disabled.',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/WithdrawResponse' } },
                        },
                    },
                  '400':
                    {
                      'description': 'Request payload validation failed',
                      'content':
                        {
                          'application/json':
                            {
                              'schema': { '$ref': '#/components/schemas/ValidationErrorResponse' },
                            },
                        },
                    },
                  '401':
                    {
                      'description': 'Authentication failed',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/AuthErrorResponse' } },
                        },
                    },
                  '409':
                    {
                      'description': 'Idempotency key conflict detected',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                { '$ref': '#/components/schemas/IdempotencyConflictResponse' },
                            },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                  '501':
                    {
                      'description': 'The withdrawal flow is disabled: no verified on-chain settlement flow is wired up yet, so the request is refused before anything is read from or written to the database. The error code is WALLET_FLOW_DISABLED.',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters': [{ '$ref': '#/components/parameters/IdempotencyKeyHeader' }],
              'requestBody':
                {
                  'required': true,
                  'content':
                    {
                      'application/json':
                        { 'schema': { '$ref': '#/components/schemas/WithdrawRequest' } },
                    },
                },
              'security': [{ 'bearerAuth': [] }],
            },
        },
      '/api/leaderboard':
        {
          'get':
            {
              'operationId': 'getLeaderboard',
              'summary': 'Rank players by net winnings (payout - bet_amount) from resolved on-chain games, optionally scoped to one game type',
              'tags': ['Leaderboard'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Leaderboard entries returned successfully',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'array',
                                  'items':
                                    {
                                      'type': 'object',
                                      'required': ['rank', 'playerAddress', 'score', 'gamesPlayed'],
                                      'properties':
                                        {
                                          'rank': { 'type': 'integer' },
                                          'playerAddress': { 'type': 'string' },
                                          'score': { 'type': 'string' },
                                          'gamesPlayed': { 'type': 'integer' },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '500':
                    {
                      'description': 'Unexpected server error',
                      'content':
                        {
                          'application/json':
                            { 'schema': { '$ref': '#/components/schemas/ErrorEnvelope' } },
                        },
                    },
                },
              'parameters':
                [
                  {
                    'name': 'game',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'string' },
                    'description': 'Optional game_type filter (e.g. coin-flip).',
                  },
                  {
                    'name': 'limit',
                    'in': 'query',
                    'required': false,
                    'schema': { 'type': 'integer', 'minimum': 1, 'maximum': 100, 'default': 10 },
                    'description': 'Maximum number of entries returned (max 100).',
                  },
                ],
            },
        },
      '/api/quests':
        {
          'get':
            {
              'operationId': 'getQuests',
              'summary': "List a player's quest progress",
              'tags': ['Quests'],
              'responses':
                {
                  '200':
                    {
                      'description': 'Quest progress returned successfully',
                      'content':
                        {
                          'application/json':
                            {
                              'schema':
                                {
                                  'type': 'array',
                                  'items':
                                    {
                                      'type': 'object',
                                      'required':
                                        ['questId', 'progress', 'target', 'claimed', 'streak'],
                                      'properties':
                                        {
                                          'questId': { 'type': 'string' },
                                          'progress': { 'type': 'integer' },
                                          'target': { 'type': 'integer' },
                                          'claimed': { 'type': 'boolean' },
                                          'streak': { 'type': 'integer' },
                                        },
                                    },
                                },
                            },
                        },
                    },
                  '400':
                    {
                      'description': 'Missing or invalid "player" query parameter',
                      'content':
                        {
                          'application/json':
